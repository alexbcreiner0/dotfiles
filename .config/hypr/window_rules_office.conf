# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

windowrulev2 = float,class:Alacritty
windowrulev2 = size 600 400,class:Alacritty
windowrulev2 = move cursor -300 -200,class:Alacritty
windowrulev2 = float,class:nemo
windowrulev2 = size 700 530,class:nemo
windowrulev2 = float,class:org.gnome.Weather
windowrulev2 = size 1060 500,class:org.gnome.Weather
windowrulev2 = float,class:org.gnome.Calendar
windowrulev2 = size 1000 700,class:org.gnome.Calendar
windowrulev2 = float,class:nwg-look
windowrulev2 = size 660 600,class:nwg-look
windowrulev2 = float,class:blueberry.py
windowrulev2 = size 600 600,class:blueberry.py
windowrulev2 = move cursor -200 -200,class:blueberry.py
windowrulev2 = float,class:org.gnome.clocks
windowrulev2 = size 600 400,class:org.gnome.clock
windowrulev2 = float,class:org.pulseaudio.pavucontrol
windowrulev2 = size 630 340,class:org.pulseaudio.pavucontrol
windowrulev2 = float,class:org.gnome.Settings
windowrulev2 = size 700 800,class:org.gnome.Settings
windowrule = monitor:1,env:GDK_SCALE=1
# windowrulev2 = float,class:kitty
# windowrulev2 = size 600 400,class:kitty
# windowrulev2 = float,class:Spotify
windowrulev2 = size 600 400,class:Spotify
# windowrulev2 = move cursor,class:kitty
windowrulev2 = float,class:Popsicle
windowrulev2 = size 550 400,class:Popsicle
windowrulev2 = float,class:Signal
windowrulev2 = size 840 530,class:Signal

# Office specific window rules
windowrulev2 = monitor DP-4, class:Google-chrome
windowrulev2 = monitor DP-4, class:Spotify
windowrulev2 = monitor DP-4, class:Signal

windowrulev2 = suppressevent maximize, class:.*C
