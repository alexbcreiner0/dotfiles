
# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

# unscale XWayland
xwayland {
  force_zero_scaling = true
}

####################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nemo
$menu = rofi -show drun > ~/rofi.log 2>&1
#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = dunst -config "$HOME/.config/dunst/dunstrc" 
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = hyprpaper
exec-once = hypridle
exec-once = waybar
exec-once = numlockx on
# exec-once = libinput-gestures-setup start
# exec-once = nwg-panel

# exec-once = nm-applet &
exec-once = copyq --start-server
# exec-once = nm-applet --indicator
exec-once = wl-clipboard-history-t
exec-once = wl-paste --watch cliphist store
exec-once = hyprpm enable hyprexpo

exec-once = wlsunset -l 42.360081 -L -71.058884
exec-once = insync start
exec-once = kdeconnect-app
exec-once = com.hunterwittenborn.Celeste
exec-once = nextcloud

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = GDK_SCALE, 1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = HYPRSHOT_DIR,/home/alex/Pictures/Screenshots
env = QT_QPA_PLATFORMTHEME, qt6ct # not sure what this is
env = HYPRCURSOR_THEME, Bibata-Modern-Classic

#####################
### LOOK AND FEEL ###
#####################

source = ~/.config/hypr/general.conf
source = ~/.config/hypr/decoration.conf

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
    force_split = 2
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
# master {
#     new_is_master = true
# }

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    disable_splash_rendering = true
}

#############
### INPUT ###
#############

source = ~/.config/hypr/input.conf

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

source = ~/.config/hypr/keybindings.conf

###############
### PLUGINS ###
###############

plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(111111)
        workspace_method = center 5 # [center/first] [workspace] e.g. first 1 or center m+1

        enable_gesture = true # laptop touchpad
        gesture_fingers = 3  # 3 or 4
        gesture_distance = 300 # how far is the "max"
        gesture_positive = true # positive = swipe down. Negative = swipe up.
    }
}

plugin {
    hyprbars {
        # example config
        bar_height = 25

        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(ff4040), 20, 󰖭, hyprctl dispatch killactive
        # hyprbars-button = rgb(eeee11), 20, , hyprctl dispatch fullscreen 1
    }
}

# bind = $mainMod, grave, hyprexpo:expo, toggle # can be: toggle, off/disable or on/enable

##############################
### WINDOWS AND WORKSPACES ###
##############################

source = ~/.config/hypr/window_rules.conf
